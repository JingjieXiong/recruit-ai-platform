      <text x="105" y="31" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#315f56">Fixture demo included</text>
      <rect x="226" width="232" height="48" rx="24" fill="#eef3df"/>
      <text x="342" y="31" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#526548">Provider-neutral</text>
