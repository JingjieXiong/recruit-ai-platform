  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1130" cy="78" r="210" fill="#d8ef91" opacity="0.32"/>
  <circle cx="90" cy="610" r="250" fill="#a9dfcf" opacity="0.25"/>

  <g transform="translate(78 70)">
