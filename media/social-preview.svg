    <g transform="translate(52 48)">
      <rect width="62" height="62" rx="20" fill="url(#card)"/>
      <text x="31" y="41" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#fff">R</text>
      <text x="82" y="39" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#173a36">Recruit AI Platform</text>
