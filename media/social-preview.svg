      <text x="0" y="64" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#173a36">from application to interview.</text>
      <text x="2" y="132" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5f7671">
        Resume screening · Candidate evaluation · Interview orchestration · Human review
      </text>
    </g>

    <g transform="translate(52 398)">
