      <path d="M20 229 H164" stroke="#d8e5e0" stroke-width="8" stroke-linecap="round"/>
      <path d="M20 229 H126" stroke="#4b917f" stroke-width="8" stroke-linecap="round"/>
      <text x="92" y="268" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5f7671">REPORT WRITTEN BACK</text>
