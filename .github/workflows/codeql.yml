name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  private-repository-notice:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CodeQL upload requires GitHub Code Security while this repository is Private."
          echo "The analyze job activates automatically after the repository becomes Public."

  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.37.3
